<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lx-music mobile 预览</title>
  <style>
    @font-face {
      font-family: 'icomoon';
      src: url('/fonts/icomoon.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #111; }
    body { display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #phone {
      width: 393px; height: 852px; border-radius: 28px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6); background: #fff; position: relative;
      transform-origin: center center; flex-shrink: 0;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="phone"><div id="root"></div></div>
  <script>
    // 自适应缩放：容器（内置面板/浏览器窗口）比手机框小则整体等比缩小，大则原尺寸居中
    (function () {
      var phone = document.getElementById('phone')
      function fit() {
        var s = Math.min(1, (window.innerWidth - 24) / phone.offsetWidth, (window.innerHeight - 24) / phone.offsetHeight)
        phone.style.transform = 'scale(' + s + ')'
      }
      window.addEventListener('resize', fit)
      fit()
    })()
  </script>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
