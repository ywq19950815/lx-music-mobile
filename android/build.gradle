// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 29

        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24" // Or any version above 1.3.x
        RNNKotlinVersion = kotlinVersion

        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    buildscript {
        repositories {
            all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository) {
                    def url = repo.url.toString()
                    if (url.contains('repo1.maven.org') || url.contains('repo.maven.apache.org') || url.contains('jcenter.bintray.com')) {
                        repo.url = uri('https://maven.aliyun.com/repository/public')
                    }
                    if (url.contains('dl.google.com') || url.contains('maven.google.com')) {
                        repo.url = uri('https://maven.aliyun.com/repository/google')
                    }
                    if (url.contains('plugins.gradle.org')) {
                        repo.url = uri('https://maven.aliyun.com/repository/gradle-plugin')
                    }
                }
            }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
    }
    repositories {
        all { ArtifactRepository repo ->
            if (repo instanceof MavenArtifactRepository) {
                def url = repo.url.toString()
                if (url.contains('repo1.maven.org') || url.contains('repo.maven.apache.org') || url.contains('jcenter.bintray.com')) {
                    repo.url = uri('https://maven.aliyun.com/repository/public')
                }
                if (url.contains('dl.google.com') || url.contains('maven.google.com')) {
                    repo.url = uri('https://maven.aliyun.com/repository/google')
                }
                if (url.contains('plugins.gradle.org')) {
                    repo.url = uri('https://maven.aliyun.com/repository/gradle-plugin')
                }
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
}
